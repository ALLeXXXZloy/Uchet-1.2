name: Android CI Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Указываем рабочую папку, где лежит build.gradle.kts
    defaults:
      run:
        working-directory: ./Uchet-main/Uchet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Этот экшен автоматически установит Gradle нужной версии
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Запускаем тесты напрямую через установленный Gradle
      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Upload Test Report (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./Uchet-main/Uchet/app/build/reports/tests/testDebugUnitTest/
